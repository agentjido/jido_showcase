name: CI

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
      - release/v3

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  quality:
    name: ${{ matrix.showcase }} / Elixir ${{ matrix.elixir }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - showcase: jido_assembly
            path: jido_assembly
            elixir: "1.18.4"
            otp: "27.3"
          - showcase: jido_assembly
            path: jido_assembly
            elixir: "1.19.5"
            otp: "28.3"
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.path }}
    env:
      MIX_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1.24.0
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - name: Restore Mix cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ${{ matrix.path }}/deps
            ${{ matrix.path }}/_build
          key: ${{ runner.os }}-mix-${{ matrix.showcase }}-otp-${{ matrix.otp }}-elixir-${{ matrix.elixir }}-${{ hashFiles(format('{0}/mix.lock', matrix.path)) }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.showcase }}-otp-${{ matrix.otp }}-elixir-${{ matrix.elixir }}-

      - name: Install Hex and Rebar
        run: |
          set -euo pipefail
          mix local.hex --force
          mix local.rebar --force

      - name: Install dependencies
        run: mix deps.get

      - name: Check retired packages
        run: mix hex.audit

      - name: Compile development configuration
        env:
          MIX_ENV: dev
        run: mix compile --warnings-as-errors

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

      - name: Run tests
        run: mix test

      - name: Check unused dependencies
        run: mix deps.unlock --check-unused

      - name: Audit dependencies
        run: mix deps.audit --ignore-file .mix_audit.ignore

  application-build:
    name: jido_assembly / Application build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: jido_assembly
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1.24.0
        with:
          otp-version: "28.3"
          elixir-version: "1.19.5"

      - name: Restore Mix cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            jido_assembly/deps
            jido_assembly/_build
          key: ${{ runner.os }}-mix-jido-assembly-build-${{ hashFiles('jido_assembly/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-jido-assembly-build-

      - name: Install Hex and Rebar
        run: |
          set -euo pipefail
          mix local.hex --force
          mix local.rebar --force

      - name: Install dependencies
        run: mix deps.get

      - name: Install asset tools
        run: mix assets.setup

      - name: Compile Hologram application
        run: HOLOGRAM_START=1 mix compile --force

      - name: Build production assets
        run: mix assets.deploy

  browser:
    name: jido_assembly / Browser scenarios
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: jido_assembly
    env:
      MIX_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1.24.0
        with:
          otp-version: "28.3"
          elixir-version: "1.19.5"

      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "24"

      - name: Restore Mix cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            jido_assembly/deps
            jido_assembly/_build
          key: ${{ runner.os }}-mix-jido-assembly-browser-${{ hashFiles('jido_assembly/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-jido-assembly-browser-

      - name: Install Mix dependencies and asset tools
        run: |
          set -euo pipefail
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix assets.setup

      - name: Compile Hologram and build assets
        run: |
          set -euo pipefail
          HOLOGRAM_START=1 mix compile --force --warnings-as-errors
          mix assets.build

      - name: Install Playwright, Chromium, and SQLite CLI
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/assembly-browser" --no-save --package-lock=false playwright@1.65.1
          "$RUNNER_TEMP/assembly-browser/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get install -y sqlite3

      - name: Run browser scenarios
        env:
          ASSEMBLY_PLAYWRIGHT_MODULE: ${{ runner.temp }}/assembly-browser/node_modules/playwright
          ASSEMBLY_BROWSER_CHANNEL: chromium
          ASSEMBLY_BROWSER_ARTIFACTS: ${{ runner.temp }}/assembly-browser-evidence
        run: node --test --test-concurrency=1 test/browser/ui*.test.cjs

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: assembly-browser-evidence
          path: ${{ runner.temp }}/assembly-browser-evidence
          if-no-files-found: ignore
